<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-label="Hunkwise 架构（窄屏）：cli、git diff、diff.ts、probes.ts、server、attestation、gate 与 pre-push 的纵向流程及其数据文件" data-palette="dce656-9ce76a-f6e0ac-5e58edbd6e33">
<style>
    text{font-family:-apple-system,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:5 7;animation:march 1.9s linear infinite}
    .flow-slow{stroke-dasharray:4 8;animation:march 3.6s linear infinite}
    .drift1{animation:drift1 12s ease-in-out infinite alternate}
    .drift2{animation:drift2 15s ease-in-out infinite alternate}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .pulse2{animation:pulse 4.4s ease-in-out infinite}
    .blink{animation:blink 2.8s steps(2,jump-none) infinite}
    @keyframes march{to{stroke-dashoffset:-24}}
    @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(11px,-15px)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-13px,11px)}}
    @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="halo" cx="50%" cy="46%" r="64%">
    <stop offset="0%" stop-color="#dce656" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="#9ce76a" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#0a0c0d" stop-opacity="0"/>
  </radialGradient>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#dce656"/>
  </marker>
  <marker id="arwm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#b0b9a8"/>
  </marker>
</defs>
<rect width="720" height="1120" fill="#0a0c0d"/>
<rect width="720" height="1120" fill="url(#halo)"/>
<g opacity="0.55"><line x1="60" y1="0" x2="60" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="120" y1="0" x2="120" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="180" y1="0" x2="180" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="240" y1="0" x2="240" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="300" y1="0" x2="300" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="360" y1="0" x2="360" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="420" y1="0" x2="420" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="480" y1="0" x2="480" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="540" y1="0" x2="540" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="600" y1="0" x2="600" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="660" y1="0" x2="660" y2="1120" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="60" x2="720" y2="60" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="120" x2="720" y2="120" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="180" x2="720" y2="180" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="240" x2="720" y2="240" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="300" x2="720" y2="300" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="360" x2="720" y2="360" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="420" x2="720" y2="420" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="480" x2="720" y2="480" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="540" x2="720" y2="540" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="600" x2="720" y2="600" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="660" x2="720" y2="660" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="720" x2="720" y2="720" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="780" x2="720" y2="780" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="840" x2="720" y2="840" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="900" x2="720" y2="900" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="960" x2="720" y2="960" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="1020" x2="720" y2="1020" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="1080" x2="720" y2="1080" stroke="#383c1d" stroke-width="0.6"/></g>

  <text x="40" y="46" font-size="28" font-weight="650" fill="#fdf9ee">架构</text>
  <text x="40" y="74" font-size="15" fill="#b0b9a8">一个 Node 进程，几次只读的 git 子进程调用。</text>
  <rect x="40" y="92" width="640" height="58" rx="9" fill="#131713" stroke="#383c1d"/>
  <text x="58" y="116" class="mono" font-size="14" fill="#fdf9ee">src/cli.ts</text>
  <text x="58" y="137" font-size="13" fill="#b0b9a8">只解析参数并打印；命令都从这里出发。</text>
  <rect x="40" y="166" width="640" height="56" rx="9" fill="#131717" stroke="#383c1d"/>
  <text x="58" y="190" class="mono" font-size="15" fill="#fdf9ee">git diff -U0 &lt;base&gt;...HEAD</text>
  <text x="58" y="211" font-size="13.5" fill="#b0b9a8">只读：看改动，不写仓库。</text>
  <line x1="70" y1="222" x2="70" y2="1010" stroke="#b0b9a8" stroke-width="1" stroke-dasharray="2 7"/>
<circle cx="70" cy="282" r="5" fill="#dce656" class=""/>
  <rect x="96" y="248" width="584" height="92" rx="10" fill="#131717" stroke="#383c1d" stroke-width="1"/>
  <text x="116" y="276" class="mono" font-size="17.5" fill="#fdf9ee">src/diff.ts</text>
  <text x="116" y="301" font-size="14.5" fill="#b0b9a8">片段 · 事实 · 指纹 · 豁免</text>
  <text x="116" y="325" class="mono" font-size="13.5" fill="#dce656">→ .hunkwise/diff.json</text><path d="M 70 292 L 70 348" stroke="#b0b9a8" stroke-width="1.2" marker-end="url(#arwm)"/><circle cx="70" cy="408" r="5" fill="#dce656" class=""/>
  <rect x="96" y="374" width="584" height="92" rx="10" fill="#131717" stroke="#383c1d" stroke-width="1"/>
  <text x="116" y="402" class="mono" font-size="17.5" fill="#fdf9ee">src/probes.ts</text>
  <text x="116" y="427" font-size="14.5" fill="#b0b9a8">每片段 1–3 题 · 兄弟干扰项</text>
  <text x="116" y="451" class="mono" font-size="13.5" fill="#dce656">→ .hunkwise/probes.json</text><path d="M 70 418 L 70 474" stroke="#b0b9a8" stroke-width="1.2" marker-end="url(#arwm)"/><circle cx="70" cy="534" r="5" fill="#dce656" class=""/>
  <rect x="96" y="500" width="584" height="92" rx="10" fill="#131717" stroke="#383c1d" stroke-width="1"/>
  <text x="116" y="528" class="mono" font-size="17.5" fill="#fdf9ee">src/server.ts</text>
  <text x="116" y="553" font-size="14.5" fill="#b0b9a8">只绑 127.0.0.1 · workbench.html</text>
  <text x="116" y="577" class="mono" font-size="13.5" fill="#dce656">→ .hunkwise/answers.json</text><path d="M 70 544 L 70 600" stroke="#b0b9a8" stroke-width="1.2" marker-end="url(#arwm)"/><circle cx="70" cy="660" r="5" fill="#dce656" class=""/>
  <rect x="96" y="626" width="584" height="92" rx="10" fill="#131717" stroke="#383c1d" stroke-width="1"/>
  <text x="116" y="654" class="mono" font-size="17.5" fill="#fdf9ee">src/attestation.ts</text>
  <text x="116" y="679" font-size="14.5" fill="#b0b9a8">zod · 覆盖率 · HMAC-SHA256</text>
  <text x="116" y="703" class="mono" font-size="13.5" fill="#dce656">→ attestations/&lt;head&gt;.json</text><path d="M 70 670 L 70 726" stroke="#b0b9a8" stroke-width="1.2" marker-end="url(#arwm)"/><circle cx="70" cy="786" r="5" fill="#dce656" class="pulse"/>
  <rect x="96" y="752" width="584" height="92" rx="10" fill="#131717" stroke="#dce656" stroke-width="1.7"/>
  <text x="116" y="780" class="mono" font-size="17.5" fill="#fdf9ee">src/gate.ts</text>
  <text x="116" y="805" font-size="14.5" fill="#b0b9a8">重算 diff 与答案键 · 不读 probes.json</text>
  <text x="116" y="829" class="mono" font-size="13.5" fill="#dce656">→ exit 0 / 1</text><path d="M 70 796 L 70 852" stroke="#b0b9a8" stroke-width="1.2" marker-end="url(#arwm)"/><circle cx="70" cy="912" r="5" fill="#dce656" class=""/>
  <rect x="96" y="878" width="584" height="92" rx="10" fill="#131717" stroke="#383c1d" stroke-width="1"/>
  <text x="116" y="906" class="mono" font-size="17.5" fill="#fdf9ee">.git/hooks/pre-push</text>
  <text x="116" y="931" font-size="14.5" fill="#b0b9a8">verify-push 逐个 commit 校验</text>
  <text x="116" y="955" class="mono" font-size="13.5" fill="#dce656">install-hook 写它</text>
  <text x="40" y="1054" font-size="14" fill="#b0b9a8">没有数据库、守护进程、账号或网络调用；状态全是 .hunkwise/ 下的扁平 JSON。</text>
  <text x="40" y="1080" class="mono" font-size="13" fill="#dce656">gate 每次从分支重算，不信任磁盘缓存。</text>
</svg>
