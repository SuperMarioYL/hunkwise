<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564" role="img" aria-label="能力与集成：中心闸门连到四类事实、八种豁免原因、git diff 与 pre-push 与 verify-push 三个接触点，以及标注为路线图的 CI runner" data-palette="dce656-9ce76a-f6e0ac-5e58edbd6e33">
<style>
    text{font-family:-apple-system,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:5 7;animation:march 1.9s linear infinite}
    .flow-slow{stroke-dasharray:4 8;animation:march 3.6s linear infinite}
    .drift1{animation:drift1 12s ease-in-out infinite alternate}
    .drift2{animation:drift2 15s ease-in-out infinite alternate}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .pulse2{animation:pulse 4.4s ease-in-out infinite}
    .blink{animation:blink 2.8s steps(2,jump-none) infinite}
    @keyframes march{to{stroke-dashoffset:-24}}
    @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(11px,-15px)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-13px,11px)}}
    @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="halo" cx="50%" cy="46%" r="64%">
    <stop offset="0%" stop-color="#dce656" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="#9ce76a" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#0a0c0d" stop-opacity="0"/>
  </radialGradient>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#dce656"/>
  </marker>
  <marker id="arwm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#b0b9a8"/>
  </marker>
</defs>
<rect width="1200" height="564" fill="#0a0c0d"/>
<rect width="1200" height="564" fill="url(#halo)"/>
<g opacity="0.55"><line x1="60" y1="0" x2="60" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="120" y1="0" x2="120" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="180" y1="0" x2="180" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="240" y1="0" x2="240" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="300" y1="0" x2="300" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="360" y1="0" x2="360" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="420" y1="0" x2="420" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="480" y1="0" x2="480" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="540" y1="0" x2="540" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="600" y1="0" x2="600" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="660" y1="0" x2="660" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="720" y1="0" x2="720" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="780" y1="0" x2="780" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="840" y1="0" x2="840" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="900" y1="0" x2="900" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="960" y1="0" x2="960" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="1020" y1="0" x2="1020" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="1080" y1="0" x2="1080" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="1140" y1="0" x2="1140" y2="564" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="60" x2="1200" y2="60" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="120" x2="1200" y2="120" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="180" x2="1200" y2="180" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="240" x2="1200" y2="240" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="300" x2="1200" y2="300" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="360" x2="1200" y2="360" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="420" x2="1200" y2="420" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="480" x2="1200" y2="480" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="540" x2="1200" y2="540" stroke="#383c1d" stroke-width="0.6"/></g>

  <text x="40" y="44" font-size="24" font-weight="650" fill="#fdf9ee">能力与集成 <tspan font-size="15" fill="#b0b9a8">· 四类事实、八种豁免、三个 git 接触点</tspan></text>
  <circle cx="600" cy="268" r="122" fill="none" stroke="#383c1d" stroke-width="1" stroke-dasharray="3 8"/>
  <circle cx="600" cy="268" r="186" fill="none" stroke="#383c1d" stroke-width="0.8" stroke-dasharray="2 10" opacity="0.8"/>
  <line x1="600" y1="190" x2="600" y2="96" stroke="#dce656" stroke-width="1" opacity="0.35" class="flow-slow"/>
  <line x1="600" y1="346" x2="600" y2="414" stroke="#dce656" stroke-width="1.1" opacity="0.5" class="flow"/>
  <path d="M 548 232 L 335 186" stroke="#dce656" stroke-width="1.2" opacity="0.5" class="flow"/>
  <path d="M 652 232 L 866 186" stroke="#9ce76a" stroke-width="1.2" opacity="0.5" class="flow"/>
  <polygon points="600,192 668,231 668,305 600,344 532,305 532,231" fill="#131717" stroke="#dce656" stroke-width="2"/>
  <polygon points="600,210 652,240 652,296 600,326 548,296 548,240" fill="none" stroke="#dce656" stroke-width="0.8" opacity="0.5"/>
  <text x="600" y="264" text-anchor="middle" class="mono" font-size="22" font-weight="650" fill="#fdf9ee">gate</text>
  <text x="600" y="286" text-anchor="middle" class="mono" font-size="11.5" fill="#dce656">exit 0 / 1</text>
  <text x="600" y="308" text-anchor="middle" font-size="11.5" fill="#b0b9a8">答案键从 diff 重算</text>
  <rect x="150" y="150" width="196" height="34" rx="17" fill="#131717" stroke="#dce656" stroke-width="1.4"/>
