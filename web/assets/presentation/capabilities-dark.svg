  <rect x="100" y="206" width="146" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="173" y="225.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">guard_removed</text>
  <rect x="256" y="206" width="146" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="329" y="225.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">new_branch</text>
  <rect x="100" y="250" width="146" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="173" y="269.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">error_path_changed</text>
  <rect x="256" y="250" width="146" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="329" y="269.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">symbol_renamed</text>
  <text x="248" y="300" text-anchor="middle" font-size="11.5" fill="#b0b9a8">文本规则 · 不建 AST</text>
  <rect x="854" y="150" width="196" height="34" rx="17" fill="#131717" stroke="#9ce76a" stroke-width="1.4"/>
  <text x="952" y="172" text-anchor="middle" font-size="13" fill="#fdf9ee">八种豁免原因</text>
  <rect x="794" y="206" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="868" y="225.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">no_fact</text>
  <rect x="952" y="206" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="1026" y="225.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">generated</text>
  <rect x="794" y="242" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="868" y="261.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">comment-only</text>
  <rect x="952" y="242" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="1026" y="261.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">binary</text>
  <rect x="794" y="278" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="868" y="297.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">whitespace</text>
  <rect x="952" y="278" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="1026" y="297.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">mode-change</text>
  <rect x="794" y="314" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="868" y="333.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">lockfile</text>
  <rect x="952" y="314" width="148" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="1026" y="333.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">rename-only</text>
  <text x="952" y="364" text-anchor="middle" font-size="11.5" fill="#b0b9a8">显式豁免 · 不进分母</text>
  <rect x="470" y="400" width="260" height="32" rx="16" fill="#131717" stroke="#dce656" stroke-width="1.4"/>
  <text x="600" y="421" text-anchor="middle" font-size="13" fill="#fdf9ee">三个 git 接触点</text>
  <rect x="400" y="446" width="170" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="485" y="465.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">git diff -U0</text>
  <rect x="580" y="446" width="118" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="639" y="465.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">pre-push</text>
  <rect x="708" y="446" width="156" height="30" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="786" y="465.5" text-anchor="middle" class="mono" font-size="12" fill="#dce656">verify-push refs</text>
  <rect x="874" y="446" width="186" height="30" rx="7" fill="none" stroke="#b0b9a8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="967" y="465.5" text-anchor="middle" class="mono" font-size="12" fill="#b0b9a8">CI runner · 路线图（未交付）</text>
  <text x="40" y="520" font-size="12.5" fill="#b0b9a8">读改动、挂本地闸门、逐个 commit 校验；CI 接入尚未交付。落在四类之外的行为改动以 no_fact 豁免，而不是被猜成一道题。</text>
  <g class="mono" font-size="11.5" fill="#b0b9a8">
    <rect x="960" y="500" width="20" height="12" rx="3" fill="#131713" stroke="#383c1d"/><text x="988" y="510">当前实现</text>
    <rect x="1064" y="500" width="20" height="12" rx="3" fill="none" stroke="#b0b9a8" stroke-dasharray="3 3"/><text x="1092" y="510">路线图</text>
  </g>
</svg>
