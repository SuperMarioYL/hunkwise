  <text x="1024" y="206" class="mono" font-size="14.5" fill="#262a1c">src/gate.ts</text>
  <text x="1024" y="228" font-size="11.5" fill="#6e7869">重算 diff 与答案键</text>
  <text x="1024" y="246" class="mono" font-size="11" fill="#6e7869">不读 probes.json</text>
  <text x="1024" y="263" font-size="11.5" fill="#6e7869">verify · exit 0 / 1</text>
  <path d="M 1085 272 L 1085 372" stroke="#74792d" stroke-width="1.6" stroke-dasharray="4 6" class="flow-slow"/>
  <rect x="1000" y="372" width="160" height="82" rx="10" fill="#fdfef7" stroke="#74792d" stroke-width="1.7"/>
  <text x="1016" y="398" class="mono" font-size="14" fill="#262a1c">pre-push hook</text>
  <text x="1016" y="418" font-size="11.5" fill="#6e7869">verify-push 逐个 commit</text>
  <text x="1016" y="440" class="mono" font-size="11" fill="#74792d">.git/hooks/pre-push</text>
  <text x="1000" y="470" font-size="11" fill="#6e7869">install-hook 写它</text>
  <rect x="40" y="372" width="920" height="88" rx="10" fill="#fdfef7" stroke="#f4f7cb"/>
  <text x="64" y="402" font-size="15" fill="#262a1c">没有数据库，没有守护进程，没有账号，没有网络调用。</text>
  <text x="64" y="426" font-size="12.5" fill="#6e7869">全部状态是 .hunkwise/ 下的扁平 JSON；init 把这个目录写进 .gitignore，所以 key 与答案不随分支走。换台机器要重新 init。</text>
  <text x="64" y="447" font-size="12.5" fill="#6e7869">gate 不信任记录：每次都从分支重算 diff、重新出题、重新判分，再比对 diff_sha256、片段指纹与 HMAC 摘要。</text>
  <g class="mono" font-size="11" fill="#6e7869">
    <line x1="40" y1="500" x2="74" y2="500" stroke="#74792d" stroke-width="1.6" class="flow"/><text x="84" y="504">数据流</text>
    <line x1="180" y1="500" x2="214" y2="500" stroke="#6e7869" stroke-width="1" stroke-dasharray="2 5"/><text x="224" y="504">调用 / 写入</text>
    <circle cx="380" cy="500" r="4" fill="#7f7459"/><text x="392" y="504">入口 / 出口</text>
  </g>
  <text x="40" y="546" class="mono" font-size="11" fill="#74792d">.hunkwise/ 不进 git；存证是防篡改，不是身份归属。</text>
</svg>
