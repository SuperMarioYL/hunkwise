<svg xmlns="http://www.w3.org/2000/svg" width="720" height="890" viewBox="0 0 720 890" role="img" aria-label="能力与集成（窄屏）：闸门向下连到四类事实、八种豁免原因与三个 git 接触点，CI 标注为路线图" data-palette="dce656-9ce76a-f6e0ac-5e58edbd6e33">
<style>
    text{font-family:-apple-system,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace}
    .flow{stroke-dasharray:5 7;animation:march 1.9s linear infinite}
    .flow-slow{stroke-dasharray:4 8;animation:march 3.6s linear infinite}
    .drift1{animation:drift1 12s ease-in-out infinite alternate}
    .drift2{animation:drift2 15s ease-in-out infinite alternate}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .pulse2{animation:pulse 4.4s ease-in-out infinite}
    .blink{animation:blink 2.8s steps(2,jump-none) infinite}
    @keyframes march{to{stroke-dashoffset:-24}}
    @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(11px,-15px)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-13px,11px)}}
    @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="halo" cx="50%" cy="46%" r="64%">
    <stop offset="0%" stop-color="#dce656" stop-opacity="0.14"/>
    <stop offset="55%" stop-color="#9ce76a" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#0a0c0d" stop-opacity="0"/>
  </radialGradient>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#dce656"/>
  </marker>
  <marker id="arwm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#b0b9a8"/>
  </marker>
</defs>
<rect width="720" height="890" fill="#0a0c0d"/>
<rect width="720" height="890" fill="url(#halo)"/>
<g opacity="0.55"><line x1="60" y1="0" x2="60" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="120" y1="0" x2="120" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="180" y1="0" x2="180" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="240" y1="0" x2="240" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="300" y1="0" x2="300" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="360" y1="0" x2="360" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="420" y1="0" x2="420" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="480" y1="0" x2="480" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="540" y1="0" x2="540" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="600" y1="0" x2="600" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="660" y1="0" x2="660" y2="890" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="60" x2="720" y2="60" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="120" x2="720" y2="120" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="180" x2="720" y2="180" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="240" x2="720" y2="240" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="300" x2="720" y2="300" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="360" x2="720" y2="360" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="420" x2="720" y2="420" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="480" x2="720" y2="480" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="540" x2="720" y2="540" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="600" x2="720" y2="600" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="660" x2="720" y2="660" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="720" x2="720" y2="720" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="780" x2="720" y2="780" stroke="#383c1d" stroke-width="0.6"/><line x1="0" y1="840" x2="720" y2="840" stroke="#383c1d" stroke-width="0.6"/></g>

  <text x="40" y="44" font-size="28" font-weight="650" fill="#fdf9ee">能力与集成</text>
  <text x="40" y="72" font-size="15" fill="#b0b9a8">四类事实、八种豁免、三个 git 接触点。</text>
  <polygon points="100,92 150,121 150,179 100,208 50,179 50,121" fill="#131717" stroke="#dce656" stroke-width="2"/>
  <text x="100" y="150" text-anchor="middle" class="mono" font-size="16" font-weight="650" fill="#fdf9ee">gate</text>
  <text x="100" y="170" text-anchor="middle" class="mono" font-size="10.5" fill="#dce656">exit 0 / 1</text>
  <line x1="100" y1="208" x2="100" y2="842" stroke="#383c1d" stroke-width="1" stroke-dasharray="2 8"/>
  <circle cx="100" cy="262" r="7" fill="#dce656"/><text x="124" y="268" font-size="16" fill="#fdf9ee">四类文本事实</text>
  <rect x="130" y="286" width="240" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="307.5" class="mono" font-size="14" fill="#dce656">guard_removed</text>
  <rect x="390" y="286" width="240" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="404" y="307.5" class="mono" font-size="14" fill="#dce656">new_branch</text>
  <rect x="130" y="330" width="240" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="351.5" class="mono" font-size="14" fill="#dce656">error_path_changed</text>
  <rect x="390" y="330" width="240" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="404" y="351.5" class="mono" font-size="14" fill="#dce656">symbol_renamed</text>
  <text x="130" y="389" font-size="13" fill="#b0b9a8">文本规则 · 不建 AST · 不做跨语言语义分析</text>
  <circle cx="100" cy="430" r="7" fill="#9ce76a"/><text x="124" y="436" font-size="16" fill="#fdf9ee">八种豁免原因 · 不进分母</text>
  <rect x="130" y="456" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="477.5" class="mono" font-size="14" fill="#dce656">no_fact</text>
  <rect x="396" y="456" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="410" y="477.5" class="mono" font-size="14" fill="#dce656">comment-only</text>
  <rect x="130" y="496" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="517.5" class="mono" font-size="14" fill="#dce656">whitespace</text>
  <rect x="396" y="496" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="410" y="517.5" class="mono" font-size="14" fill="#dce656">lockfile</text>
  <rect x="130" y="536" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="557.5" class="mono" font-size="14" fill="#dce656">generated</text>
  <rect x="396" y="536" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="410" y="557.5" class="mono" font-size="14" fill="#dce656">binary</text>
  <rect x="130" y="576" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="597.5" class="mono" font-size="14" fill="#dce656">mode-change</text>
  <rect x="396" y="576" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="410" y="597.5" class="mono" font-size="14" fill="#dce656">rename-only</text>
  <circle cx="100" cy="650" r="7" fill="#dce656"/><text x="124" y="656" font-size="16" fill="#fdf9ee">三个 git 接触点</text>
  <rect x="130" y="676" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="697.5" class="mono" font-size="14" fill="#dce656">git diff -U0</text>
  <rect x="396" y="676" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="410" y="697.5" class="mono" font-size="14" fill="#dce656">pre-push</text>
  <rect x="130" y="720" width="250" height="34" rx="7" fill="#131713" stroke="#383c1d" stroke-width="1" />
  <text x="144" y="741.5" class="mono" font-size="14" fill="#dce656">verify-push refs</text>
  <rect x="396" y="720" width="284" height="34" rx="7" fill="none" stroke="#b0b9a8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="410" y="741.5" class="mono" font-size="11.5" fill="#b0b9a8">CI runner · 路线图（未交付）</text>
  <text x="40" y="802" font-size="13.5" fill="#b0b9a8">读改动、挂本地闸门、逐个 commit 校验；CI 接入尚未交付。</text>
  <text x="40" y="825" font-size="13.5" fill="#b0b9a8">落在四类之外的行为改动以 no_fact 豁免，而不是被猜成一道题。</text>
</svg>
