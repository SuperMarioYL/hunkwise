  </marker>
  <marker id="arwm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#6e7869"/>
  </marker>
</defs>
<rect width="720" height="1000" fill="#fefef9"/>
<rect width="720" height="1000" fill="url(#halo)"/>
