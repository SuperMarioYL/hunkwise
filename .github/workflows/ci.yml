name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: typecheck and test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The suite is vitest over the pure modules: diff parsing and fact
      # extraction, probe synthesis, coverage math, digest stability, and the
      # gate driven through a real temporary git repository. No network, no
      # database, no browser.
      - name: Test
        run: npm test
